<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>        
    <script src="script.js"></script>    
</head>
<body>

    <div class="container">
        <h3 align="center">tortas</h3>
        <br />
        <div align="right" style="margin-bottom:5px;">
            <button type="button" name="add_button" id="add_button" class="btn btn-success btn-xs">Crear</button>
        </div>

        <div id="apicrudModal" class="modal fade" role="dialog">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form method="post" id="api_crud_form">
                        <div class="modal-header">
                            <h4 class="modal-title">Crear Torta</h4>
                          </div>
                          <div class="modal-body">
                              <div class="form-group">
                                <label>Nombre</label>
                                <input type="text" name="nombre" id="nombre" class="form-control" required/>
                            </div>
                            <div class="form-group">
                                <label>descripcion</label>
                                <input type="text" name="descripcion" id="descripcion" class="form-control"/>
                            </div>
                            <div class="form-group">
                                <label>Precio</label>
                                <input type="text" name="precio" id="precio" class="form-control" />
                            </div>                            
                        </div>
                        <div class="modal-footer">
                            <input type="hidden" name="hidden_id" id="hidden_id" />
                            <input type="hidden" name="action" id="action" value="insert" />
                            <input type="submit" name="button_action" id="button_action" class="btn btn-info" value="Guardar" />
                            <button type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
                          </div>
                    </form>
                </div>
              </div>
        </div>


        <div class="table-responsive">
            <table class="table table-bordered table-striped" id="table_tortas">
                <thead>
                    <tr>
                        <th>nombre</th>
                        <th>descripcion</th>
                        <th>precio</th>
                        <th>editar</th>
                        <th>borrar</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>        
</body>
</html>
